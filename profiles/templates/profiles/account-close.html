{% extends "base.html" %}
{% load static %}
{% block content %}

    <!-- Page Header Start -->
    <div class="page-header" style="background: url({% static 'img/banner1.jpg' %});">
      <div class="container">
        <div class="row">         
          <div class="col-md-12">
            <div class="breadcrumb-wrapper">
              <h2 class="product-title">Close Account</h2>
              <ol class="breadcrumb">
                <li><a href="#">Home /</a></li>
                <li class="current">Close</li>
              </ol>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Page Header End -->  

    <!-- Start Content -->
    <div class="section-padding">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-5 col-md-12 col-xs-12">
            <div class="login-area">
              <h3><i class="lni-close"></i> Close account </h3>
              <div class="close-account">
                <p>Closing your account will prevent you from signing in. Your existing listings will remain available to their buyers.</p>
                <form method="post">
                  {% csrf_token %}
                  <label class="d-block mb-3">
                    <input name="confirm_close" value="yes" type="checkbox" required>
                    I understand and want to deactivate my account.
                  </label>
                  <button type="submit" class="btn btn-danger">Deactivate account</button>
                </form>
              </div>
            </div>
          </div>
        </div>  
      </div>      
    </div>
    <!-- End Content -->

    {% endblock content %}
